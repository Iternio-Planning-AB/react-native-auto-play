name: Publish React Native Autoplay

on:
  release:
    types: [created]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine branch for release tag
        id: release-branch
        env:
          # the branch picked as the release target. Guessing it from the branches that contain
          # the tag picked whichever sorted first, e.g. a feature branch cut from master, and
          # published that branch's tip instead of the tagged commit
          TARGET: ${{ github.event.release.target_commitish }}
        run: |
          echo "Resolving branch for tag: $GITHUB_REF_NAME (release target: $TARGET)"

          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF_NAME")

          if ! BRANCH_COMMIT=$(git rev-parse --verify --quiet "refs/remotes/origin/$TARGET"); then
            echo "::error::Release target '$TARGET' is not a branch. Create the release with a branch as target."
            exit 1
          fi

          # the version bump is committed on top of the branch and the branch is published, so it
          # must not have moved past the tagged commit
          if [ "$BRANCH_COMMIT" != "$TAG_COMMIT" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG_COMMIT) is not the tip of $TARGET ($BRANCH_COMMIT). Tag the current tip of $TARGET."
            exit 1
          fi

          echo "branch=$TARGET" >> "$GITHUB_OUTPUT"
          echo "✅ Release branch: $TARGET"

      - name: Checkout release branch
        run: |
          git checkout ${{ steps.release-branch.outputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install monorepo dependencies
        run: yarn install --frozen-lockfile

      - name: Update package.json version from release tag
        working-directory: ./packages/react-native-autoplay
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          node -e "
          const fs = require('fs');
          const pkg = require('./package.json');
          pkg.version = '${VERSION}';
          fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('Updated to: ${VERSION}');
          "

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Commit version bump
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "react-native-autoplay-bot"
          git config user.email "react-native-autoplay-bot@users.noreply.github.com"
      
          git remote set-url origin https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git
      
          git add packages/react-native-autoplay/package.json

          if git diff --cached --quiet; then
            echo "No version changes"
          else
            git commit -m "chore(react-native-autoplay): bump version to ${GITHUB_REF_NAME#v} [skip ci]"
            git push origin ${{ steps.release-branch.outputs.branch }}
            echo "✅ Committed to ${{ steps.release-branch.outputs.branch }}"
          fi

      - name: Yarn package install & git clean check
        working-directory: ./packages/react-native-autoplay
        run: |
          yarn install --frozen-lockfile
          if ! git diff --exit-code; then
            echo "::error::❌ Git dirty after yarn!"
            git diff
            exit 1
          fi
          echo "✅ Git clean"

      - name: Publish to npm
        working-directory: ./packages/react-native-autoplay
        run: |
          npm publish \
            --access public \
            --tag ${{ github.event.release.prerelease && 'alpha' || 'latest' }} \
            --non-interactive
