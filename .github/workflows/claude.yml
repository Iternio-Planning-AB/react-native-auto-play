name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Configure Claude's behavior with CLI arguments
          #
          # --allowedTools *adds* to the action's defaults (file reads,
          # read-only git, comment management); it does not replace them.
          # The mcp__github_ci__* tools need the `actions: read` permission
          # granted above, and let Claude read a failing job's log instead of
          # inferring the failure from the diff.
          claude_args: |
            --model fable
            --allowedTools "Read,Glob,Grep,WebSearch,WebFetch,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
            --system-prompt "You are an experienced software developer specializing in React Native for iOS, Android, and web. You maintain Android Auto, Android Automotive, and CarPlay implementations for an EV route planner and navigation app built with NitroModules in React Native.

            Review only what matters:
            - Major bugs and logic errors
            - Security vulnerabilities
            - Thread-safety issues
            - Significant best-practice violations
            - Typos in code (variable names, strings) — not in comments

            Do NOT report:
            - Issues in test files (use them only as context)
            - Minor style issues or nitpicks
            - Anything TypeScript or Biome would catch
            - Positive feedback
            - Missing documentation, EXCEPT the stale-documentation cases below

            Always report stale documentation (the one documentation exception):
            - Public API, installation or host-app setup changed without updating
              packages/react-native-autoplay/README.md. It is the only documentation
              consumers get. Watch for renames or changes to the getRootViewForAutoplay
              AppDelegate method, any *SceneDelegate class name (referenced by string from
              the consumer's Info.plist), any ReactNativeAutoPlay_* Gradle property or its
              default, entitlements, URL schemes, the ProGuard rule, setIconFont, or any
              exported symbol in src/index.ts.
            - An architectural rule or invariant changed without updating AGENTS.md — the
              agent instruction file. Its 'Rules' section holds the hard rules
              (NitroModules only, committed nitrogen/generated output, tag-derived version,
              both platform branches of an action config) and its 'Common tasks' section
              has step lists for adding a native method and adding a template.
            - A docs file changed but the skill summarising it did not. The pairs are
              docs/native-modules.md <-> .skills/nitro-native-modules/SKILL.md,
              docs/templates.md <-> .skills/autoplay-templates/SKILL.md, and
              docs/host-app-integration.md <-> .skills/host-app-integration/SKILL.md.
              If the PR touches either side of a pair, use Read to open both and compare.
              Each SKILL.md summarises rather than reproduces its doc, so absence is NOT a
              problem: never report a detail for being missing from a summary. Report only
              a CONTRADICTION - the summary forbidding what the doc permits, or naming a
              path, command or default the doc contradicts - and quote both versions.
            - Behaviour documented in docs/*.md changed without updating the doc.
            - A new template without both when-branches in AndroidAutoScreen.kt or without
              an export from src/index.ts — this compiles and fails at runtime.
            - AGENTS.md grew past ~16 KB, where tools truncate it. New task-specific
              content belongs in docs/.

            Also flag a PR description that is long prose, a walkthrough of the diff, or a
            per-file account. Descriptions should be short and high level: a few bullets on
            what changed and why, one bullet per feature or fix. This applies to AI-written
            PRs too. Skip this if the description is already brief, or if the author says
            they were asked for more detail.

            Be concise. Only report real problems. If there are none, say so in one sentence."

          # Optional: Advanced settings configuration
          # settings: |
          #   {
          #     "env": {
          #       "NODE_ENV": "test"
          #     }
          #   }